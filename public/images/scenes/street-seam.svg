<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 88" width="1184" height="88" shape-rendering="crispEdges" role="img" aria-hidden="true">
  <!-- 街缘贯通线（设计官原创 · v4.11 素材）：草地带 + 路缘石 + 右侧房舍群落。
       8px 网格；底部缘石亮边 #a4b88b 与街角电视区顶部 4px 路沿同色对接，构成一条贯通的街道边线。 -->

  <!-- ===== 草地带（y40–72）===== -->
  <rect x="0" y="40" width="1184" height="32" fill="#8fa876"/>
  <!-- 草面亮边，8px 阶梯起伏 -->
  <g fill="#a4b88b">
    <rect x="0" y="32" width="240" height="8"/>
    <rect x="240" y="40" width="168" height="8"/>
    <rect x="408" y="32" width="320" height="8"/>
    <rect x="728" y="40" width="120" height="8"/>
    <rect x="848" y="32" width="336" height="8"/>
  </g>
  <!-- 草色补丁（深一档） -->
  <g fill="#7d9666">
    <rect x="56" y="56" width="48" height="8"/>
    <rect x="280" y="48" width="32" height="8"/>
    <rect x="472" y="60" width="56" height="8"/>
    <rect x="712" y="52" width="40" height="8"/>
    <rect x="1000" y="56" width="64" height="8"/>
    <rect x="152" y="64" width="24" height="8"/>
    <rect x="880" y="64" width="32" height="8"/>
  </g>
  <!-- 草簇（少量，避免过度装饰） -->
  <g fill="#5f7d4a">
    <rect x="120" y="48" width="8" height="12"/>
    <rect x="112" y="52" width="8" height="8"/>
    <rect x="128" y="52" width="8" height="8"/>
    <rect x="356" y="56" width="8" height="12"/>
    <rect x="348" y="60" width="8" height="8"/>
    <rect x="364" y="60" width="8" height="8"/>
    <rect x="1092" y="44" width="8" height="12"/>
    <rect x="1084" y="48" width="8" height="8"/>
    <rect x="1100" y="48" width="8" height="8"/>
  </g>

  <!-- ===== 左段小物（木牌在 HTML 层，此处只放两件日常物）===== -->
  <!-- 邮筒（歪一点，带小旗） -->
  <g>
    <rect x="72" y="52" width="8" height="20" fill="#6b4a2f"/>
    <rect x="56" y="36" width="32" height="16" fill="#b9573f"/>
    <rect x="56" y="32" width="32" height="4" fill="#d4714f"/>
    <rect x="88" y="24" width="8" height="8" fill="#e9cf83"/>
    <rect x="80" y="28" width="8" height="4" fill="#e9cf83"/>
  </g>
  <!-- 小花一株 -->
  <g>
    <rect x="216" y="60" width="4" height="8" fill="#5f7d4a"/>
    <rect x="212" y="52" width="12" height="8" fill="#d98c2b"/>
    <rect x="216" y="56" width="4" height="4" fill="#e9cf83"/>
  </g>

  <!-- ===== 右段房舍群落（落在草地带之上）===== -->
  <!-- 房 A：奶油墙 + 砖红顶 -->
  <g>
    <rect x="848" y="40" width="96" height="32" fill="#f0e6cf"/>
    <rect x="840" y="36" width="112" height="8" fill="#a35a44"/>
    <rect x="856" y="28" width="80" height="8" fill="#a35a44"/>
    <rect x="872" y="20" width="48" height="8" fill="#a35a44"/>
    <rect x="888" y="12" width="16" height="8" fill="#a35a44"/>
    <rect x="864" y="48" width="16" height="16" fill="#6b86a8"/>
    <rect x="912" y="48" width="16" height="16" fill="#6b86a8"/>
    <rect x="888" y="56" width="16" height="16" fill="#7a5236"/>
  </g>
  <!-- 树 -->
  <g>
    <rect x="968" y="52" width="8" height="20" fill="#6b4a2f"/>
    <rect x="952" y="32" width="40" height="20" fill="#5f7d4a"/>
    <rect x="960" y="20" width="24" height="12" fill="#75955c"/>
  </g>
  <!-- 房 B：米黄墙 + 灰绿顶，整体右倾 8px（轻微不对称） -->
  <g>
    <rect x="1024" y="48" width="88" height="24" fill="#e6d3b2"/>
    <rect x="1016" y="40" width="104" height="8" fill="#6e7d52"/>
    <rect x="1032" y="32" width="72" height="8" fill="#6e7d52"/>
    <rect x="1048" y="24" width="40" height="8" fill="#6e7d52"/>
    <rect x="1040" y="52" width="12" height="12" fill="#6b86a8"/>
    <rect x="1080" y="52" width="12" height="12" fill="#6b86a8"/>
    <rect x="1060" y="56" width="16" height="16" fill="#7a5236"/>
  </g>
  <!-- 小烟囱（房 B） -->
  <g>
    <rect x="1096" y="16" width="12" height="16" fill="#8a6a52"/>
  </g>

  <!-- ===== 路缘石（y72–88），底边亮条与电视区 4px 路沿同色对接 ===== -->
  <rect x="0" y="72" width="1184" height="4" fill="#a4b88b"/>
  <rect x="0" y="76" width="1184" height="12" fill="#96876b"/>
  <g fill="#7c6c52">
    <rect x="64" y="76" width="4" height="12"/>
    <rect x="192" y="76" width="4" height="12"/>
    <rect x="320" y="76" width="4" height="12"/>
    <rect x="448" y="76" width="4" height="12"/>
    <rect x="576" y="76" width="4" height="12"/>
    <rect x="704" y="76" width="4" height="12"/>
    <rect x="832" y="76" width="4" height="12"/>
    <rect x="960" y="76" width="4" height="12"/>
    <rect x="1088" y="76" width="4" height="12"/>
  </g>
</svg>
